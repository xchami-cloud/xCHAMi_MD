name: xCHAMi MD 24/7 Advance System

on:
  push:
    branches: [ main ]
  schedule:
    # සෑම පැය 5 කට වරක් බොට්ව ස්වයංක්‍රීයව Restart කරයි (පැය 6 සීමාව පැනීමට පෙර)
    - cron: '0 */5 * * *'
  workflow_dispatch: # ඔබට අවශ්‍ය විටෙක අතින් Run කිරීමට

jobs:
  xchami-bot-job:
    runs-on: ubuntu-latest
    # බොට් එක දිගට පැය 6 ක් වැඩ කරන බව සහතික කිරීමට timeout එකක් දමමු
    timeout-minutes: 350 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # අලුත්ම Node.js version එක පාවිච්චි කරමු

      - name: Install Dependencies
        run: |
          npm install
          npm install groq-sdk

      - name: Run xCHAMi MD Bot
        # මෙහිදී 'timeout' එකක් භාවිතා කර බොට් එක නියමිත වෙලාවට කලින් නවත්වා අලුතින් පටන් ගැනීමට ඉඩ සලසයි
        run: timeout 340m node index.js || true
        env:
          NODE_ENV: production
